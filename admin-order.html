  <main class="main-content">
    <section class="order-section">
      <div class="card order-card">
        <h2 class="section-title">Create New Order</h2>
        <p class="form-subtitle">Place orders for Followers, Likes, Comments, Reactions, and Views.</p>

        <form id="orderForm" class="order-form">
          <div class="form-row-inline form-row-inline-3">
            <div class="form-row">
              <label class="form-label">Transaction ID</label>
              <input id="transactionId" class="form-input" type="text" placeholder="Enter payment transaction ID" required>
            </div>

            <div class="form-row">
              <label class="form-label">Category</label>
              <select id="category" class="form-input">
                <option value="follows">Follows</option>
                <option value="likes">Likes</option>
                <option value="comments">Comments</option>
                <option value="reactions">Reactions</option>
                <option value="views">Views</option>
              </select>
            </div>

            <div class="form-row">
              <label class="form-label">Quantity</label>
              <input id="quantity" class="form-input" type="number" min="1" value="5000" required>
            </div>
          </div>

          <div class="form-row">
            <label class="form-label">Target Link</label>
            <input id="targetLink" class="form-input" type="url" placeholder="https://example.com/post-or-profile" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="submit-button"><span class="button-text">Place Order</span></button>
          </div>
        </form>

        <div id="orderResult" class="order-result" aria-live="polite" style="display:none"></div>
      </div>
    </section>
